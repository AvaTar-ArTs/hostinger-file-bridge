[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hostinger-file-bridge"
version = "0.1.0"
description = "Secure SFTP file bridge with MCP, browser upload, and CLI interfaces."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AvaTar-ArTs"}]
dependencies = [
  "mcp[cli]>=1.0.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "paramiko>=3.5",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
]

[project.scripts]
hostinger-file-bridge = "hostinger_file_bridge.server:main"
hostinger-upload = "hostinger_file_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hostinger_file_bridge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
